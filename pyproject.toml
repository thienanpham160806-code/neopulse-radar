[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neopulse-radar"
version = "0.1.0"
description = "NeoPulse Radar - radar nhịp thị trường, áp lực sổ lệnh và cảnh báo bất thường trên NEO API (VPBankS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pandas>=2.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "streamlit>=1.50",
    "plotly>=5.20",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
parquet = ["pyarrow>=15"]

[project.scripts]
neopulse = "neopulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neopulse = ["analytics/templates/*.j2", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
